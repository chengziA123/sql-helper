<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- ============================================================
         字符编码与视口设置
         - UTF-8 确保中文正常显示
         - viewport 适配移动设备
         ============================================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL助手 · 优化版</title>

    <!-- ============================================================
         CSS 样式区域
         ============================================================ -->
    <style>
        /* ---------- 全局 CSS 变量（主题色、间距、圆角等） ---------- */
        :root {
            --bg-body: #f0f4f9;          /* 页面背景色 */
            --bg-card: #ffffff;           /* 卡片背景色 */
            --border-light: #e5edf5;      /* 浅边框色 */
            --text-primary: #0b1a2e;      /* 主文字色（深色） */
            --text-secondary: #334e68;    /* 次要文字色 */
            --text-muted: #7a8fa6;        /* 浅色文字（提示） */
            --blue-500: #3b82f6;          /* 主按钮蓝色 */
            --blue-600: #2563eb;          /* 蓝色悬停 */
            --blue-50: #eff6ff;           /* 蓝色浅背景 */
            --green-500: #10b981;         /* 成功按钮绿色 */
            --green-600: #059669;         /* 绿色悬停 */
            --amber-500: #f59e0b;         /* 警告色（示例按钮） */
            --red-500: #ef4444;           /* 危险色 */
            --slate-800: #1e293b;         /* 深色背景（输出框） */
            --slate-900: #0f172a;         /* 输出框更深色 */
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06); /* 卡片阴影 */
            --radius-card: 14px;          /* 卡片大圆角 */
            --radius-sm: 8px;             /* 小圆角 */
            --transition: 0.18s ease;     /* 过渡动画 */
        }

        /* ---------- 重置默认边距，统一盒模型 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ---------- 页面整体布局 ---------- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            padding: 16px 14px;            /* 页面内边距（较小） */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1280px;            /* 最大宽度，适配大屏 */
            width: 100%;
        }

        /* ---------- 页面头部 ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 14px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.2px;
        }
        .app-header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0;
        }
        .header-badge {
            background: var(--blue-50);
            color: var(--blue-600);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        /* ---------- 主网格（左侧设置面板 + 右侧输入/输出） ---------- */
        .app-grid {
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        /* ---------- 左侧面板（选项设置） ---------- */
        .left-panel {
            flex: 0 0 270px;              /* 固定宽度 270px */
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            padding: 14px 14px 12px;
        }
        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 每个选项组 */
        .option-group {
            margin-bottom: 10px;
        }
        .option-group:last-child {
            margin-bottom: 0;
        }
        .option-group .group-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }
        .option-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 0;
            transition: color var(--transition);
        }
        .option-group label:hover {
            color: var(--text-primary);
        }
        .option-group label code {
            background: #f1f5f9;
            padding: 0 5px;
            border-radius: 3px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .option-group input[type="radio"],
        .option-group input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--blue-500);
            flex-shrink: 0;
            margin: 0;
            cursor: pointer;
        }

        /* 缩进输入框 */
        .indent-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .indent-row input[type="number"] {
            width: 55px;
            padding: 2px 5px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 12px;
            height: 26px;
            background: #fafbfc;
            transition: border var(--transition);
        }
        .indent-row input[type="number"]:focus {
            border-color: var(--blue-500);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .indent-row span {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 提示信息框 */
        .tip-box {
            background: #fffbeb;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: #92400e;
            font-size: 11px;
            border-left: 3px solid var(--amber-500);
            margin-top: 10px;
            line-height: 1.5;
        }
        .tip-box strong {
            font-weight: 600;
        }

        /* ---------- 右侧面板 ---------- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }

        /* 卡片通用样式 */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
        }
        .card-input,
        .card-output {
            flex: 1;                     /* 均分垂直空间 */
            display: flex;
            flex-direction: column;
        }

        /* 卡片头部 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-bottom: 8px;
            min-height: 32px;
        }
        .card-header .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-header .badge {
            background: var(--border-light);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 30px;
        }

        /* ---------- 按钮样式 ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .btn {
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all var(--transition);
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
            background: #eef2f6;
            color: var(--text-secondary);
        }
        .btn:hover {
            background: #e2e8f0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        /* 颜色变体 */
        .btn-primary {
            background: var(--blue-500);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--blue-600);
        }
        .btn-success {
            background: var(--green-500);
            color: #fff;
        }
        .btn-success:hover {
            background: var(--green-600);
        }
        .btn-amber {
            background: var(--amber-500);
            color: #fff;
        }
        .btn-amber:hover {
            background: #d97706;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border-light);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .btn-danger {
            background: var(--red-500);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            height: 24px;
            padding: 2px 10px;
            font-size: 10px;
        }

        /* ---------- 下拉选择器（模式选择） ---------- */
        .mode-select {
            height: 24px;
            font-size: 10px;
            border-radius: 40px;
            border: 1.5px solid var(--border-light);
            background: #ffffff;
            color: var(--text-secondary);
            padding: 0 4px;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border var(--transition);
            width: auto;
            min-width: 56px;
            letter-spacing: 0.2px;
        }
        .mode-select:hover {
            border-color: var(--blue-500);
        }
        .mode-select:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        /* ---------- 双栏容器（输入框 / 输出框） ---------- */
        .split-panel {
            display: flex;
            gap: 8px;
            height: 188px;            /* 高度增加四分之一 */
            flex-shrink: 0;
        }
        .split-panel>textarea,
        .split-panel>.output-box {
            flex: 1;
            height: 100%;
            padding: 8px 10px;
            font-size: 12px;
            font-family: "Courier New", monospace;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: #fafbfc;
            transition: border var(--transition), box-shadow var(--transition);
            color: var(--text-primary);
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
        }
        .split-panel>textarea:focus {
            border-color: var(--blue-500);
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
        }
        .split-panel>textarea::placeholder {
            color: #b0c4d8;
        }
        .split-panel>textarea:read-only {
            background: #f1f5f9;
            color: #1e293b;
        }
        .split-panel .translation-box {
            background: #f8fafc;
        }

        /* 输出框（div）的只读样式 */
        .split-panel .output-box {
            background: #f1f5f9;
            color: #1e293b;
            border-color: var(--border-light);
            white-space: pre-wrap;
            word-break: break-all;
            cursor: default;
        }
        .split-panel .output-box .placeholder {
            color: #b0c4d8;
            font-style: italic;
        }

        /* 自定义滚动条（美化） */
        .split-panel>textarea::-webkit-scrollbar,
        .split-panel .output-box::-webkit-scrollbar {
            width: 4px;
        }
        .split-panel>textarea::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .split-panel>textarea::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }
        .split-panel .output-box::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .split-panel .output-box::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }

        /* ---------- Toast 通知 ---------- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            pointer-events: none;
        }
        .toast {
            background: #0b1a2e;
            color: #f1f5f9;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(16px) scale(0.94);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ---------- 页脚 ---------- */
        .app-footer {
            margin-top: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 12px;
            letter-spacing: 0.2px;
        }

        /* ---------- 响应式适配 ---------- */
        @media (max-width: 820px) {
            body {
                padding: 12px 10px;
            }
            .app-grid {
                flex-direction: column;
            }
            .left-panel {
                flex: 1 1 auto;
                width: 100%;
            }
            .right-panel {
                flex: 1 1 auto;
            }
            .split-panel {
                height: 138px;            /* 平板端增高 */
                flex-direction: column;
                gap: 4px;
            }
            .split-panel>textarea,
            .split-panel>.output-box {
                height: 50%;
            }
            .app-header h1 {
                font-size: 19px;
            }
            .app-header h1 small {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            .app-header h1 {
                font-size: 17px;
            }
            .card {
                padding: 10px 10px 12px;
            }
            .left-panel {
                padding: 12px 10px 10px;
            }
            .toolbar .btn {
                font-size: 10px;
                padding: 2px 10px;
                height: 24px;
            }
            .mode-select {
                height: 22px;
                font-size: 9px;
                padding: 0 3px;
                min-width: 48px;
            }
            .split-panel {
                height: 125px;            /* 手机端增高 */
            }
            .split-panel>textarea,
            .split-panel>.output-box {
                font-size: 11px;
                padding: 6px 8px;
            }
        }
        /* ---------- 左下角版本号 ---------- */
        .app-version {
            position: fixed;
            left: 8px;
            bottom: 8px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.85;
            z-index: 999;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>
<!-- ============================================================
     页面主体
     ============================================================ -->
<div class="app-wrapper">

    <!-- ---------- 头部 ---------- -->
    <header class="app-header">
        <h1>
            🧰 SQL 值批量包裹工具
            <small>单/双引号 · 竖/横向</small>
        </h1>
        <span class="header-badge">⚡ 快捷 · 开源</span>
    </header>

    <!-- ---------- 主网格 ---------- -->
    <div class="app-grid">

        <!-- ===== 左侧设置面板 ===== -->
        <aside class="left-panel">
            <div class="panel-title">⚙️条件设置</div>

            <!-- 引用符号：单/双引号 -->
            <div class="option-group">
                <span class="group-label">引用符号</span>
                <label><input type="radio" name="quoteType" value="single" checked /> 单引号 <code>' '</code></label>
                <label><input type="radio" name="quoteType" value="double" /> 双引号 <code>" "</code></label>
            </div>

            <!-- 输出排列：竖向/横向 -->
            <div class="option-group">
                <span class="group-label">输出排列</span>
                <label><input type="radio" name="layout" value="vertical" checked /> 竖向</label>
                <label><input type="radio" name="layout" value="horizontal" /> 横向</label>
            </div>

            <!-- 额外选项 -->
            <div class="option-group">
                <span class="group-label">额外选项</span>
                <label><input type="checkbox" id="wrapInClause" /> 包裹成 <code>IN (...)</code></label>
                <label><input type="checkbox" id="removeDuplicates" /> 去重</label>
            </div>

            <!-- 缩进空格数 -->
            <div class="option-group">
                <span class="group-label">缩进空格数</span>
                <div class="indent-row">
                    <input type="number" id="indentSpaces" value="4" min="0" max="20" step="1" />
                    <span>（竖向生效）</span>
                </div>
            </div>

            <!-- 小提示 -->
            <div class="tip-box">
                💡 支持 <strong>换行</strong>、<strong>逗号</strong>、<strong>空格</strong>、<strong>制表符</strong> 分隔。<br />
                ↔️ 横向排列时缩进自动忽略。
            </div>
        </aside>

        <!-- ===== 右侧主工作区 ===== -->
        <main class="right-panel">

            <!-- ====== 输入卡片 ====== -->
            <section class="card card-input">
                <!-- 输入卡片头部：按钮组和“支持多种分隔符”标签 -->
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 8px;">
                    <div class="toolbar" style="margin-bottom: 0; display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="btn btn-amber btn-sm" onclick="loadSample()">📋示例</button>
                        <button class="btn btn-amber btn-sm" onclick="changeCase('upper')">🔠转大写</button>
                        <button class="btn btn-amber btn-sm" onclick="changeCase('lower')">🔡转小写</button>
                        <button class="btn btn-outline btn-sm" onclick="clearAll()">🗑️清空</button>
                        <!-- ===== 改动1：复制翻译按钮右移18个空格（使用 margin-left: 18ch） ===== -->
                        <button class="btn btn-outline btn-sm" onclick="copyTranslation()" style="margin-left: 42ch;">📋复制翻译</button>
                    </div>
                    <span class="badge" style="align-self: flex-start;">支持多种分隔符</span>
                </div>

                <!-- 双栏输入：左侧原始数据，右侧中英互译 -->
                <div class="split-panel">
                    <textarea id="inputData" placeholder="粘贴原始数据，例如：P76DMWPAW4, P76DMWPAW6, P76AMKTK39 … 或每行一个"></textarea>
                    <textarea id="translationOutput" class="translation-box" placeholder="自动翻译（中文 ⇄ 英文）" readonly></textarea>
                </div>
            </section>

            <!-- ====== 输出卡片 ====== -->
            <section class="card card-output">
                <!-- 输出卡片头部：左侧复制+快捷键，中间模式选择+复制模板，右侧结果状态 -->
                <div class="card-header" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                    <!-- 左：复制按钮 + 快捷键 -->
                    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto;">
                        <button class="btn btn-success btn-sm" onclick="copyResult()">📄复制</button>
                        <span class="footer-hint" style="margin: 0; font-size: 10px; color: #7a8fa6; display: inline-flex; align-items: center; gap: 3px;">快捷键 <kbd style="background: #eef2f6; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; color: #334e68; border: 1px solid #e2e8f0;">Ctrl+Enter</kbd> 生成</span>
                    </div>
                    <!-- 中：模式选择 + 复制模板按钮（左对齐，并通过 padding-left 控制水平位置） -->
                    <div style="display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-start; padding-left: 33ch;">
                        <select id="sqlMode" class="mode-select">
                            <option value="select">查询</option>
                            <option value="insert">增加</option>
                            <option value="delete">删除</option>
                            <option value="update">修改</option>
                        </select>
                        <button class="btn btn-success btn-sm" onclick="copyTemplateResult()">📋复制模板</button>
                    </div>
                    <!-- 右：结果标签、条数、就绪状态（右对齐） -->
                    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto;">
                        <span class="label" style="font-weight: 600; color: var(--text-secondary);">📋结果</span>
                        <span id="outputCount" style="font-size: 11px; color: var(--text-muted);">条数: 0</span>
                        <span class="badge" id="outputBadge">就绪</span>
                    </div>
                </div>

                <!-- 双栏输出：左侧带引号的值列表，右侧 SQL 模板 -->
                <div class="split-panel">
                    <div class="output-box" id="output"><span class="placeholder">等待生成…</span></div>
                    <div class="output-box" id="outputPlain"><span class="placeholder">请选择模式</span></div>
                </div>
            </section>

        </main>
    </div>

    <!-- ---------- 页脚 ---------- -->
    <footer class="app-footer">
        🛠️ SQL工具 · 优化版 · 自由使用
    </footer>
    <div class="app-version">v1.2.1</div>
</div>

<!-- ===== Toast 容器 ===== -->
<div class="toast-container" id="toastContainer">
    <div class="toast" id="toast">✅已复制</div>
</div>


<!-- ============================================================
     JavaScript 功能脚本
     ============================================================ -->
<script>
    // ---------- 获取 DOM 元素引用 ----------
    const inputEl = document.getElementById('inputData');
    const translationEl = document.getElementById('translationOutput');
    const outputEl = document.getElementById('output');
    const outputPlainEl = document.getElementById('outputPlain');
    const outputBadge = document.getElementById('outputBadge');
    const outputCount = document.getElementById('outputCount');
    const toastEl = document.getElementById('toast');
    const sqlModeSelect = document.getElementById('sqlMode');

    // ---------- 翻译功能（中英自动互译：单词多词义 + 多源切换） ----------
    let translateTimer = null;          // 防抖定时器
    let translateSeq = 0;               // 请求序号：防止旧响应覆盖新输入
    let translateAbort = null;          // 当前请求控制器：新输入时取消旧请求

    // 语言方向自动识别：输入含中文 → 中译英；否则（英文等）→ 英译中
    function detectLangDir(text) {
        return /[\u4e00-\u9fff]/.test(text)
            ? { src: 'zh', tgt: 'en' }
            : { src: 'en', tgt: 'zh' };
    }
    // 部分接口用 zh-CN 表示简体中文
    function zhCode(code) {
        return code === 'zh' ? 'zh-CN' : code;
    }

    // 是否单个词（仅英文字母，或仅汉字）
    function isSingleWord(text) {
        return /^[A-Za-z]+$/.test(text) || /^[\u4e00-\u9fff]+$/.test(text);
    }

    // 候选写法：单个英文单词时补一个全小写形式，作为回退方案使用
    function buildVariants(text, dir) {
        const variants = [text];
        if (dir.src === 'en' && /^[A-Za-z]+$/.test(text)) {
            const lower = text.toLowerCase();
            if (lower !== text && variants.indexOf(lower) < 0) variants.push(lower);
        }
        return variants;
    }

    // ---------- 后端转发（百度/有道官方接口，密钥在服务端） ----------
    const TRANSLATE_API = 'https://YOUR-PROJECT.vercel.app/api/translate'; // 部署后替换成你的 Vercel 地址

    async function backendTranslate(text, signal, dir) {
        const res = await fetch(TRANSLATE_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal,
            body: JSON.stringify({ text: text, from: dir.src, to: dir.tgt })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    }

    function backendTranslations(data) {
        const list = [];
        const p = data && data.providers ? data.providers : {};
        if (p.youdao && p.youdao.translation) list.push(String(p.youdao.translation));
        if (p.baidu && p.baidu.translation) list.push(String(p.baidu.translation));
        return list;
    }

    function backendExplains(data) {
        const p = data && data.providers ? data.providers : {};
        return (p.youdao && Array.isArray(p.youdao.explains)) ? p.youdao.explains.map(String) : [];
    }

    // 请求谷歌翻译完整数据（含词典部分 dt=bd）
    function fetchGoogleFull(text, signal, dir) {
        const url = 'https://translate.googleapis.com/translate_a/single?client=gtx' +
            '&sl=' + zhCode(dir.src) + '&tl=' + zhCode(dir.tgt) +
            '&dt=t&dt=bd&q=' + encodeURIComponent(text);
        return fetch(url, { signal }).then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        });
    }

    // 从谷歌返回中解析词典词义：按“词性”分组
    function parseGoogleDict(data) {
        const groups = [];                       // [{pos, terms:[...]}]
        const dict = (data && Array.isArray(data[1])) ? data[1] : null;
        if (!dict) return groups;
        for (const entry of dict) {
            if (!Array.isArray(entry) || !Array.isArray(entry[1])) continue;
            for (const g of entry[1]) {
                if (!Array.isArray(g)) continue;
                const pos = (typeof g[0] === 'string') ? g[0].trim() : '';
                const rawTerms = Array.isArray(g[1]) ? g[1] : [];
                const terms = [];
                for (const t of rawTerms) {
                    const term = (Array.isArray(t) && t[0]) ? String(t[0]).trim() : null;
                    if (term && terms.indexOf(term) < 0) terms.push(term);
                    if (terms.length >= 5) break;
                }
                if (terms.length) groups.push({ pos: pos, terms: terms });
                if (groups.length >= 6) break;
            }
            if (groups.length >= 6) break;
        }
        return groups;
    }

    // 从谷歌返回中取“主译文”（无词典时的回退）
    function googlePrimaryText(data) {
        if (!data || !Array.isArray(data[0])) return '';
        return data[0].map(seg => (seg && seg[0]) || '').join('');
    }

    // 把词义分组渲染成多行文本
    function renderDictGroups(groups) {
        return groups.map(g => (g.pos ? g.pos + '：' : '') + g.terms.join('、')).join('\n');
    }

    // ---------- 有道词典（JSONP，免密钥，国内可直连）----------
    function youdaoDict(word, timeoutMs) {
        return new Promise((resolve, reject) => {
            const cbName = '__yd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const script = document.createElement('script');
            const timer = setTimeout(() => {
                cleanup();
                reject(new Error('youdao timeout'));
            }, timeoutMs || 8000);
            function cleanup() {
                clearTimeout(timer);
                try { delete window[cbName]; } catch (_) {}
                if (script.parentNode) script.parentNode.removeChild(script);
            }
            window[cbName] = (data) => {
                cleanup();
                resolve(data);
            };
            script.onerror = () => {
                cleanup();
                reject(new Error('youdao network error'));
            };
            script.src = 'https://dict.youdao.com/suggest?q=' + encodeURIComponent(word) +
                '&num=8&doctype=json&callback=' + cbName + '&le=eng';
            document.head.appendChild(script);
        });
    }

    // 从有道返回中提取中文释义
    function parseYoudao(data) {
        const entries = (data && data.data && Array.isArray(data.data.entries)) ? data.data.entries : [];
        const out = [];
        for (const e of entries) {
            const ex = e && (e.explain || e.translation || '');
            if (ex) out.push(String(ex));
        }
        return out;
    }

    // 候选翻译源：按顺序尝试，前一个失败自动切换下一个
    const TRANSLATE_SOURCES = [
        {
            name: 'Backend',
            request(text, signal, dir) {
                return backendTranslate(text, signal, dir).then(data => {
                    const list = backendTranslations(data);
                    if (!list.length) throw new Error('empty');
                    return list[0];
                });
            }
        },
        {
            name: 'Google',
            request(text, signal, dir) {
                const url = 'https://translate.googleapis.com/translate_a/single?client=gtx' +
                    '&sl=' + zhCode(dir.src) + '&tl=' + zhCode(dir.tgt) + '&dt=t&q=' +
                    encodeURIComponent(text);
                return fetch(url, { signal }).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).then(data => {
                    if (!data || !Array.isArray(data[0])) throw new Error('empty');
                    return data[0].map(seg => (seg && seg[0]) || '').join('');
                });
            }
        },
        {
            name: 'MyMemory',
            request(text, signal, dir) {
                const url = 'https://api.mymemory.translated.net/get?q=' +
                    encodeURIComponent(text) +
                    '&langpair=' + zhCode(dir.src) + '|' + zhCode(dir.tgt);
                return fetch(url, { signal }).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).then(data => {
                    const t = data && data.responseData && data.responseData.translatedText;
                    if (!t) throw new Error('empty');
                    return t;
                });
            }
        },
        {
            name: 'LibreTranslate',
            request(text, signal, dir) {
                return fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal,
                    body: JSON.stringify({ q: text, source: dir.src, target: dir.tgt, format: 'text' })
                }).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).then(data => {
                    if (!data || !data.translatedText) throw new Error('empty');
                    return data.translatedText;
                });
            }
        },
        {
            name: 'Lingva',
            request(text, signal, dir) {
                const url = 'https://lingva.ml/api/v1/' + encodeURIComponent(dir.src) + '/' +
                    encodeURIComponent(dir.tgt) + '/' + encodeURIComponent(text);
                return fetch(url, { signal }).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).then(data => {
                    if (!data || !data.translation) throw new Error('empty');
                    return data.translation;
                });
            }
        }
    ];

    const TRANSLATE_TIMEOUT = 8000; // 每个翻译源最长等待时间(毫秒)

    function translateText(text) {
        if (!text || text.trim() === '') {
            translationEl.value = '';
            return;
        }

        const dir = detectLangDir(text);

        // 新输入到来：作废上一次请求，避免旧结果覆盖新内容
        const seq = ++translateSeq;
        if (translateAbort) translateAbort.abort();

        translationEl.value = '⏳ 翻译中…';

        (async () => {
            // 1) 单个词：优先尝试“多词义”，拿不到多词义绝不提前结束
            if (isSingleWord(text)) {
                let singleFallback = ''; // 各家给的单译文，最后兜底用

                // 1.1 后端官方接口（有道 explains + 百度）——未配置时自动跳过
                if (TRANSLATE_API.indexOf('YOUR-PROJECT') < 0) {
                    const ctrl = new AbortController();
                    translateAbort = ctrl;
                    const timer = setTimeout(() => ctrl.abort(), TRANSLATE_TIMEOUT);
                    try {
                        const data = await backendTranslate(text, ctrl.signal, dir);
                        clearTimeout(timer);
                        if (seq !== translateSeq) return;
                        const explains = backendExplains(data);
                        if (explains.length) {
                            translationEl.value = explains.join('\n');
                            return;
                        }
                        const list = backendTranslations(data);
                        const uniq = [];
                        list.forEach(t => { if (!uniq.includes(t)) uniq.push(t); });
                        if (uniq.length > 1) {
                            translationEl.value = uniq.map((t, i) => (i + 1) + '. ' + t).join('\n');
                            return;
                        } else if (uniq.length === 1) {
                            singleFallback = uniq[0]; // 只有单条，先留着，继续找多词义
                        }
                    } catch (err) {
                        clearTimeout(timer);
                        console.warn('后端翻译接口不可用:', err);
                    }
                }

                // 1.2 谷歌词典：解析出“多词义”才直接返回；否则继续（不再用单译文提前返回）
                {
                    const ctrl = new AbortController();
                    translateAbort = ctrl;
                    const timer = setTimeout(() => ctrl.abort(), TRANSLATE_TIMEOUT);
                    try {
                        const data = await fetchGoogleFull(text, ctrl.signal, dir);
                        clearTimeout(timer);
                        if (seq !== translateSeq) return;
                        const groups = parseGoogleDict(data);
                        if (groups.length) {
                            translationEl.value = renderDictGroups(groups);
                            return;
                        }
                        if (!singleFallback) singleFallback = googlePrimaryText(data);
                    } catch (err) {
                        clearTimeout(timer);
                        console.warn('谷歌词典不可用:', err);
                    }
                }

                // 1.3 英文单词：有道词典（免密钥 JSONP，给多词义）
                if (dir.src === 'en') {
                    try {
                        const data = await youdaoDict(text, TRANSLATE_TIMEOUT);
                        if (seq !== translateSeq) return;
                        const senses = parseYoudao(data);
                        if (senses.length) {
                            translationEl.value = senses.join('\n');
                            return;
                        }
                    } catch (err) {
                        console.warn('有道词典不可用:', err);
                    }
                }

                // 1.4 各家都没给出多词义时，才用最佳单译文
                if (singleFallback) {
                    translationEl.value = singleFallback;
                    return;
                }
            }

            // 2) 回退：多源 + 大小写变体
            const variants = buildVariants(text, dir);
            const results = [];
            const seen = new Set();
            for (const v of variants) {
                if (seq !== translateSeq) return;
                for (const source of TRANSLATE_SOURCES) {
                    if (seq !== translateSeq) return;
                    const ctrl = new AbortController();
                    translateAbort = ctrl;
                    const timer = setTimeout(() => ctrl.abort(), TRANSLATE_TIMEOUT);
                    try {
                        const r = await source.request(v, ctrl.signal, dir);
                        clearTimeout(timer);
                        if (r && !seen.has(r)) { seen.add(r); results.push(r); }
                        break;
                    } catch (err) {
                        clearTimeout(timer);
                        console.warn('翻译源 ' + source.name + ' 不可用，尝试下一个:', err);
                    }
                }
                if (results.length >= 2) break;
            }
            if (seq !== translateSeq) return;
            if (results.length === 0) {
                translationEl.value = '⚠️ 翻译服务暂时不可用，请检查网络后重试（已自动尝试多个翻译源）';
            } else if (results.length === 1) {
                translationEl.value = results[0];
            } else {
                translationEl.value = results.map((r, i) => (i + 1) + '. ' + r).join('\n');
            }
        })();
    }
    function debouncedTranslate() {
        clearTimeout(translateTimer);
        const text = inputEl.value;
        if (!text || text.trim() === '') {
            translationEl.value = '';
            return;
        }
        translateTimer = setTimeout(() => translateText(text), 500);
    }

    inputEl.addEventListener('input', debouncedTranslate);

    // ---------- 核心功能 ----------

    function getQuoteChar() {
        return document.querySelector('input[name="quoteType"]:checked').value === 'single' ? "'" : '"';
    }

    function getLayout() {
        return document.querySelector('input[name="layout"]:checked').value;
    }

    function getIndent() {
        const val = parseInt(document.getElementById('indentSpaces').value, 10);
        return isNaN(val) || val < 0 ? 0 : val;
    }

    function parseInput() {
        const raw = inputEl.value;
        let items = raw.split(/[\n,，、\t\s]+/).map(s => s.trim()).filter(s => s !== '');
        if (document.getElementById('removeDuplicates').checked) {
            items = [...new Set(items)];
        }
        return items;
    }

    // ===== 改动2：getSqlTemplate 生成多行格式，每个值一行，缩进由 indentStr 控制 =====
    function getSqlTemplate(mode, wrapped, indentStr) {
        if (!wrapped || wrapped.length === 0) return '';
        const valuesStr = wrapped.map(val => `${indentStr}${val}`).join(',\n');
        const templates = {
            select: `SELECT * FROM 表名 WHERE 字段 IN (\n${valuesStr}\n)`,
            insert: `INSERT INTO 表名 VALUES (\n${valuesStr}\n)`,
            delete: `DELETE FROM 表名 WHERE 字段 IN (\n${valuesStr}\n)`,
            update: `UPDATE 表名 SET 字段 = 值 WHERE 字段 IN (\n${valuesStr}\n)`
        };
        return templates[mode] || '';
    }

    // ---------- 主转换函数 ----------
    function convert() {
        const items = parseInput();
        const count = items.length;

        if (count === 0) {
            outputEl.innerHTML = '<span class="placeholder">⚠️ 未检测到有效数据</span>';
            outputPlainEl.innerHTML = '<span class="placeholder">请先输入数据</span>';
            outputCount.textContent = '条数: 0';
            return;
        }

        const quote = getQuoteChar();
        const layout = getLayout();
        const indent = getIndent();
        const indentStr = ' '.repeat(indent);
        const wrapped = items.map(item => `${quote}${item}${quote}`);

        // 构建左侧输出（按用户选择的布局）
        let valueListStr = '';
        if (layout === 'vertical') {
            valueListStr = wrapped.map(val => `${indentStr}${val}`).join(',\n');
        } else {
            valueListStr = wrapped.join(', ');
        }

        let result = valueListStr;
        if (document.getElementById('wrapInClause').checked) {
            if (layout === 'vertical') {
                result = `IN (\n${valueListStr}\n)`;
            } else {
                result = `IN (${valueListStr})`;
            }
        }
        outputEl.textContent = result;
        outputCount.textContent = `条数: ${count}`;

        // ===== 改动3：生成 SQL 模板时传入 wrapped 数组和缩进字符串 =====
        const mode = sqlModeSelect.value;
        const template = getSqlTemplate(mode, wrapped, indentStr);
        if (template) {
            outputPlainEl.textContent = template;
        } else {
            outputPlainEl.innerHTML = '<span class="placeholder">请选择有效模式</span>';
        }
    }

    // ---------- 辅助功能函数 ----------

    function loadSample() {
        const sample = ['P76DMWPAW4', 'P76DMWPAW6', 'P76AMKTK39', 'X9K2L8M4N1', 'R5T7Y3U9I2'].join(', ');
        inputEl.value = sample;
        debouncedTranslate();
        convert();
        showToast('📋 已加载示例数据');
    }

    function changeCase(type) {
        const raw = inputEl.value;
        if (!raw.trim()) return;
        inputEl.value = type === 'upper' ? raw.toUpperCase() : raw.toLowerCase();
        debouncedTranslate();
        convert();
        showToast(type === 'upper' ? '🔠 已转为大写' : '🔡 已转为小写');
    }

    function clearAll() {
        inputEl.value = '';
        translationEl.value = '';
        outputEl.innerHTML = '<span class="placeholder">等待生成…</span>';
        outputPlainEl.innerHTML = '<span class="placeholder">请选择模式</span>';
        outputBadge.textContent = '就绪';
        outputCount.textContent = '条数: 0';
    }

    // ---------- 复制功能 ----------

    function copyResult() {
        const text = outputEl.textContent;
        if (!text || text.includes('等待生成') || text.includes('未检测到')) {
            showToast('⚠️ 没有可复制的内容，请先生成');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板！')).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function copyTemplateResult() {
        const text = outputPlainEl.textContent;
        if (!text || text.includes('请选择模式') || text.includes('请先输入数据')) {
            showToast('⚠️ 没有可复制的模板内容');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 模板已复制到剪贴板！')).catch(() =>
                fallbackCopyTemplate(text));
        } else {
            fallbackCopyTemplate(text);
        }
    }

    // ===== 改动4：复制翻译结果 =====
    function copyTranslation() {
        const text = translationEl.value;
        if (!text || text.trim() === '' || text.includes('⚠️')) {
            showToast('⚠️ 没有可复制的翻译内容');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 翻译已复制到剪贴板！')).catch(() => {
                translationEl.select();
                translationEl.setSelectionRange(0, 99999);
                document.execCommand('copy');
                showToast('✅ 翻译已复制到剪贴板！');
            });
        } else {
            translationEl.select();
            translationEl.setSelectionRange(0, 99999);
            document.execCommand('copy');
            showToast('✅ 翻译已复制到剪贴板！');
        }
    }

    // 回退复制（原有）
    function fallbackCopy(text) {
        const range = document.createRange();
        range.selectNodeContents(outputEl);
        const sel = window.getSelection();
        if (!sel) {
            showToast('❌ 复制失败，请手动复制');
            return;
        }
        sel.removeAllRanges();
        sel.addRange(range);
        try {
            document.execCommand('copy');
            showToast('✅ 已复制到剪贴板！');
        } catch (_) {
            showToast('❌ 复制失败，请手动选中结果框内容复制');
        }
        sel.removeAllRanges();
    }

    function fallbackCopyTemplate(text) {
        const range = document.createRange();
        range.selectNodeContents(outputPlainEl);
        const sel = window.getSelection();
        if (!sel) {
            showToast('❌ 复制失败，请手动复制');
            return;
        }
        sel.removeAllRanges();
        sel.addRange(range);
        try {
            document.execCommand('copy');
            showToast('✅ 模板已复制到剪贴板！');
        } catch (_) {
            showToast('❌ 复制失败，请手动选中内容复制');
        }
        sel.removeAllRanges();
    }

    // ---------- Toast 通知 ----------
    let toastTimer = null;

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toastEl.classList.remove('show');
        }, 2200);
    }

    // ---------- 事件绑定 ----------

    inputEl.addEventListener('input', convert);
    sqlModeSelect.addEventListener('change', convert);

    document.querySelectorAll('input[type="radio"], input[type="checkbox"], input[type="number"]').forEach(el => {
        el.addEventListener('change', function() {
            const outText = outputEl.textContent;
            if (outText && !outText.includes('等待生成') && !outText.includes('未检测到')) {
                convert();
            }
        });
    });

    inputEl.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            convert();
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        if (inputEl.value.trim()) {
            convert();
            debouncedTranslate();
        }
    });
</script>
</body>
