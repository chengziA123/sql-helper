<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL 批量加引号助手 · 优化版</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --border-light: #e5edf5;
            --text-primary: #0b1a2e;
            --text-secondary: #334e68;
            --text-muted: #7a8fa6;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-50: #eff6ff;
            --green-500: #10b981;
            --green-600: #059669;
            --amber-500: #f59e0b;
            --red-500: #ef4444;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius-card: 14px;
            --radius-sm: 8px;
            --transition: 0.18s ease;
        }

        /* ===== Reset & Base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            padding: 16px 14px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1280px;
            width: 100%;
        }

        /* ===== Header ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 14px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.2px;
        }

        .app-header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0;
        }

        .header-badge {
            background: var(--blue-50);
            color: var(--blue-600);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        /* ===== Main Grid ===== */
        .app-grid {
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        /* ===== Left Panel ===== */
        .left-panel {
            flex: 0 0 270px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            padding: 14px 14px 12px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .option-group {
            margin-bottom: 10px;
        }
        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-group .group-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 0;
            transition: color var(--transition);
        }
        .option-group label:hover {
            color: var(--text-primary);
        }

        .option-group label code {
            background: #f1f5f9;
            padding: 0 5px;
            border-radius: 3px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .option-group input[type="radio"],
        .option-group input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--blue-500);
            flex-shrink: 0;
            margin: 0;
            cursor: pointer;
        }

        .indent-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .indent-row input[type="number"] {
            width: 55px;
            padding: 2px 5px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 12px;
            height: 26px;
            background: #fafbfc;
            transition: border var(--transition);
        }
        .indent-row input[type="number"]:focus {
            border-color: var(--blue-500);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .indent-row span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .tip-box {
            background: #fffbeb;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: #92400e;
            font-size: 11px;
            border-left: 3px solid var(--amber-500);
            margin-top: 10px;
            line-height: 1.5;
        }
        .tip-box strong {
            font-weight: 600;
        }

        /* ===== Right Panel ===== */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
        }

        .card-input {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-output {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-bottom: 8px;
            min-height: 32px;
        }

        .card-header .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-header .badge {
            background: var(--border-light);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 30px;
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .btn {
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all var(--transition);
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
            background: #eef2f6;
            color: var(--text-secondary);
        }
        .btn:hover {
            background: #e2e8f0;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--blue-500);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--blue-600);
        }

        .btn-success {
            background: var(--green-500);
            color: #fff;
        }
        .btn-success:hover {
            background: var(--green-600);
        }

        .btn-amber {
            background: var(--amber-500);
            color: #fff;
        }
        .btn-amber:hover {
            background: #d97706;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border-light);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-danger {
            background: var(--red-500);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-sm {
            height: 24px;
            padding: 2px 10px;
            font-size: 10px;
        }

        /* ===== 下拉选择器 - 无底色，紧凑文字与箭头间距 ===== */
        .mode-select {
            height: 24px;
            font-size: 10px;
            border-radius: 40px;
            border: 1.5px solid var(--border-light);
            background: #ffffff;
            color: var(--text-secondary);
            padding: 0 4px;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border var(--transition);
            width: auto;
            min-width: 56px;
            letter-spacing: 0.2px;
        }
        .mode-select:hover {
            border-color: var(--blue-500);
        }
        .mode-select:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        /* ===== 双栏容器（输入 & 输出） ===== */
        .split-panel {
            display: flex;
            gap: 8px;
            height: 150px;
            flex-shrink: 0;
        }
        .split-panel > textarea,
        .split-panel > .output-box {
            flex: 1;
            height: 100%;
            padding: 8px 10px;
            font-size: 12px;
            font-family: "Courier New", monospace;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: #fafbfc;
            transition: border var(--transition), box-shadow var(--transition);
            color: var(--text-primary);
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
        }
        .split-panel > textarea:focus {
            border-color: var(--blue-500);
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
        }
        .split-panel > textarea::placeholder {
            color: #b0c4d8;
        }
        .split-panel > textarea:read-only {
            background: #f1f5f9;
            color: #1e293b;
        }
        .split-panel .translation-box {
            background: #f8fafc;
        }
        /* 输出框的只读样式（使用div） */
        .split-panel .output-box {
            background: #f1f5f9;
            color: #1e293b;
            border-color: var(--border-light);
            white-space: pre-wrap;
            word-break: break-all;
            cursor: default;
        }
        .split-panel .output-box .placeholder {
            color: #b0c4d8;
            font-style: italic;
        }
        /* 自定义滚动条 */
        .split-panel > textarea::-webkit-scrollbar,
        .split-panel .output-box::-webkit-scrollbar {
            width: 4px;
        }
        .split-panel > textarea::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .split-panel > textarea::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }
        .split-panel .output-box::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .split-panel .output-box::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            pointer-events: none;
        }
        .toast {
            background: #0b1a2e;
            color: #f1f5f9;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(16px) scale(0.94);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ===== Footer ===== */
        .app-footer {
            margin-top: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 12px;
            letter-spacing: 0.2px;
        }
        .app-footer a {
            color: var(--blue-500);
            text-decoration: none;
        }
        .app-footer a:hover {
            text-decoration: underline;
        }

        /* ===== Responsive ===== */
        @media (max-width: 820px) {
            body {
                padding: 12px 10px;
            }
            .app-grid {
                flex-direction: column;
            }
            .left-panel {
                flex: 1 1 auto;
                width: 100%;
            }
            .right-panel {
                flex: 1 1 auto;
            }
            .split-panel {
                height: 110px;
                flex-direction: column;
                gap: 4px;
            }
            .split-panel > textarea,
            .split-panel > .output-box {
                height: 50%;
            }
            .app-header h1 {
                font-size: 19px;
            }
            .app-header h1 small {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .app-header h1 {
                font-size: 17px;
            }
            .card {
                padding: 10px 10px 12px;
            }
            .left-panel {
                padding: 12px 10px 10px;
            }
            .toolbar .btn {
                font-size: 10px;
                padding: 2px 10px;
                height: 24px;
            }
            .mode-select {
                height: 22px;
                font-size: 9px;
                padding: 0 3px;
                min-width: 48px;
            }
            .split-panel {
                height: 100px;
            }
            .split-panel > textarea,
            .split-panel > .output-box {
                font-size: 11px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- ===== Header ===== -->
    <header class="app-header">
        <h1>
            🧰 SQL 值批量包裹工具
            <small>单/双引号 · 竖/横向</small>
        </h1>
        <span class="header-badge">⚡ 快捷 · 开源</span>
    </header>

    <!-- ===== Main Grid ===== -->
    <div class="app-grid">

        <!-- ===== Left Panel ===== -->
        <aside class="left-panel">
            <div class="panel-title">⚙️ 选项设置</div>

            <div class="option-group">
                <span class="group-label">引用符号</span>
                <label><input type="radio" name="quoteType" value="single" checked /> 单引号 <code>' '</code></label>
                <label><input type="radio" name="quoteType" value="double" /> 双引号 <code>" "</code></label>
            </div>

            <div class="option-group">
                <span class="group-label">输出排列</span>
                <label><input type="radio" name="layout" value="vertical" checked /> 竖向</label>
                <label><input type="radio" name="layout" value="horizontal" /> 横向</label>
            </div>

            <div class="option-group">
                <span class="group-label">额外选项</span>
                <label><input type="checkbox" id="wrapInClause" /> 包裹成 <code>IN (...)</code></label>
                <label><input type="checkbox" id="removeDuplicates" /> 去重</label>
            </div>

            <div class="option-group">
                <span class="group-label">缩进空格数</span>
                <div class="indent-row">
                    <input type="number" id="indentSpaces" value="4" min="0" max="20" step="1" />
                    <span>（竖向生效）</span>
                </div>
            </div>

            <div class="tip-box">
                💡 支持 <strong>换行</strong>、<strong>逗号</strong>、<strong>空格</strong>、<strong>制表符</strong> 分隔。<br />
                ↔️ 横向排列时缩进自动忽略。
            </div>
        </aside>

        <!-- ===== Right Panel ===== -->
        <main class="right-panel">

            <!-- ===== Input Card ===== -->
            <section class="card card-input">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 8px;">
                    <div class="toolbar" style="margin-bottom: 0; display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="btn btn-amber btn-sm" onclick="loadSample()">📋 示例</button>
                        <button class="btn btn-amber btn-sm" onclick="changeCase('upper')">🔠 转大写</button>
                        <button class="btn btn-amber btn-sm" onclick="changeCase('lower')">🔡 转小写</button>
                        <button class="btn btn-outline btn-sm" onclick="clearAll()">🗑️ 清空</button>
                    </div>
                    <span class="badge" style="align-self: flex-start;">支持多种分隔符</span>
                </div>

                <div class="split-panel">
                    <textarea id="inputData" placeholder="粘贴原始数据，例如：P76DMWPAW4, P76DMWPAW6, P76AMKTK39 … 或每行一个"></textarea>
                    <textarea id="translationOutput" class="translation-box" placeholder="英文翻译" readonly></textarea>
                </div>
            </section>

            <!-- ===== Output Card ===== -->
            <section class="card card-output">
                <!-- ===== 头部单行 flex：左（复制+快捷键），中（flex:1，查询+复制模板，左对齐，并整体右移16ch），右（结果+条数+就绪，右对齐） ===== -->
                <div class="card-header" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                    <!-- 左 -->
                    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto;">
                        <button class="btn btn-success btn-sm" onclick="copyResult()">📄 复制</button>
                        <span class="footer-hint" style="margin: 0; font-size: 10px; color: #7a8fa6; display: inline-flex; align-items: center; gap: 3px;">快捷键 <kbd style="background: #eef2f6; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; color: #334e68; border: 1px solid #e2e8f0;">Ctrl+Enter</kbd> 生成</span>
                    </div>
                    <!-- 中：flex:1，左对齐，增加 padding-left: 16ch 实现整体右移两个8ch -->
                    <div style="display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-start; padding-left: 16ch;">
                        <select id="sqlMode" class="mode-select">
                            <option value="select">查询</option>
                            <option value="insert">增加</option>
                            <option value="delete">删除</option>
                            <option value="update">修改</option>
                        </select>
                        <!-- 复制模板按钮 -->
                        <button class="btn btn-success btn-sm" onclick="copyTemplateResult()">📋 复制模板</button>
                    </div>
                    <!-- 右：右对齐 -->
                    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto;">
                        <span class="label" style="font-weight: 600; color: var(--text-secondary);">📋 结果</span>
                        <span id="outputCount" style="font-size: 11px; color: var(--text-muted);">条数: 0</span>
                        <span class="badge" id="outputBadge">就绪</span>
                    </div>
                </div>

                <!-- 输出区域双栏 -->
                <div class="split-panel">
                    <div class="output-box" id="output"><span class="placeholder">等待生成…</span></div>
                    <div class="output-box" id="outputPlain"><span class="placeholder">请选择模式</span></div>
                </div>
            </section>

        </main>
    </div>

    <!-- ===== Footer ===== -->
    <footer class="app-footer">
        🛠️ SQL 值批量包裹工具 · 优化版 · 自由使用
    </footer>
</div>

<!-- ===== Toast ===== -->
<div class="toast-container" id="toastContainer">
    <div class="toast" id="toast">✅ 已复制</div>
</div>

<script>
    // ============================================================
    //  DOM refs
    // ============================================================
    const inputEl = document.getElementById('inputData');
    const translationEl = document.getElementById('translationOutput');
    const outputEl = document.getElementById('output');
    const outputPlainEl = document.getElementById('outputPlain');
    const outputBadge = document.getElementById('outputBadge');
    const outputCount = document.getElementById('outputCount');
    const toastEl = document.getElementById('toast');
    const sqlModeSelect = document.getElementById('sqlMode');

    // ============================================================
    //  翻译功能（使用 mymemory 免费 API，带防抖）
    // ============================================================
    let translateTimer = null;

    function translateText(text) {
        if (!text || text.trim() === '') {
            translationEl.value = '';
            return;
        }
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.responseData && data.responseData.translatedText) {
                    translationEl.value = data.responseData.translatedText;
                } else {
                    translationEl.value = '⚠️ 翻译失败';
                }
            })
            .catch(() => {
                translationEl.value = '⚠️ 翻译服务不可用';
            });
    }

    function debouncedTranslate() {
        clearTimeout(translateTimer);
        const text = inputEl.value;
        if (!text || text.trim() === '') {
            translationEl.value = '';
            return;
        }
        translateTimer = setTimeout(() => translateText(text), 500);
    }

    inputEl.addEventListener('input', debouncedTranslate);

    // ============================================================
    //  核心功能
    // ============================================================
    function getQuoteChar() {
        return document.querySelector('input[name="quoteType"]:checked').value === 'single' ? "'" : '"';
    }

    function getLayout() {
        return document.querySelector('input[name="layout"]:checked').value;
    }

    function getIndent() {
        const val = parseInt(document.getElementById('indentSpaces').value, 10);
        return isNaN(val) || val < 0 ? 0 : val;
    }

    function parseInput() {
        const raw = inputEl.value;
        let items = raw.split(/[\n,，、\t\s]+/).map(s => s.trim()).filter(s => s !== '');
        if (document.getElementById('removeDuplicates').checked) {
            items = [...new Set(items)];
        }
        return items;
    }

    // ===== 生成 SQL 模板 =====
    function getSqlTemplate(mode, count) {
        if (count === 0) return '';
        const placeholders = Array(count).fill('?').join(', ');
        const templates = {
            select: `SELECT * FROM {表名} WHERE {字段} IN (${placeholders})`,
            insert: `INSERT INTO {表名} ({字段列表}) VALUES (${placeholders})`,
            delete: `DELETE FROM {表名} WHERE {字段} IN (${placeholders})`,
            update: `UPDATE {表名} SET {字段} = {值} WHERE {字段} IN (${placeholders})`
        };
        return templates[mode] || '';
    }

    function convert() {
        const items = parseInput();
        const count = items.length;
        // 更新左侧输出
        if (count === 0) {
            outputEl.innerHTML = '<span class="placeholder">⚠️ 未检测到有效数据</span>';
            outputPlainEl.innerHTML = '<span class="placeholder">请先输入数据</span>';
            outputCount.textContent = '条数: 0';
            return;
        }
        const quote = getQuoteChar();
        const layout = getLayout();
        const indent = getIndent();
        const indentStr = ' '.repeat(indent);
        const wrapped = items.map(item => `${quote}${item}${quote}`);
        // 左侧结果
        let result = '';
        if (layout === 'vertical') {
            result = wrapped.map(val => `${indentStr}${val}`).join(',\n');
        } else {
            result = wrapped.join(', ');
        }
        if (document.getElementById('wrapInClause').checked) {
            if (layout === 'vertical') {
                result = `IN (\n${result}\n)`;
            } else {
                result = `IN (${result})`;
            }
        }
        outputEl.textContent = result;
        outputCount.textContent = `条数: ${count}`;

        // ===== 更新右侧 SQL 模板 =====
        const mode = sqlModeSelect.value;
        const template = getSqlTemplate(mode, count);
        if (template) {
            outputPlainEl.textContent = template;
        } else {
            outputPlainEl.innerHTML = '<span class="placeholder">请选择有效模式</span>';
        }
    }

    function loadSample() {
        const sample = ['P76DMWPAW4', 'P76DMWPAW6', 'P76AMKTK39', 'X9K2L8M4N1', 'R5T7Y3U9I2'].join(', ');
        inputEl.value = sample;
        debouncedTranslate();
        convert();
        showToast('📋 已加载示例数据');
    }

    function changeCase(type) {
        const raw = inputEl.value;
        if (!raw.trim()) return;
        inputEl.value = type === 'upper' ? raw.toUpperCase() : raw.toLowerCase();
        debouncedTranslate();
        convert();
        showToast(type === 'upper' ? '🔠 已转为大写' : '🔡 已转为小写');
    }

    function clearAll() {
        inputEl.value = '';
        translationEl.value = '';
        outputEl.innerHTML = '<span class="placeholder">等待生成…</span>';
        outputPlainEl.innerHTML = '<span class="placeholder">请选择模式</span>';
        outputBadge.textContent = '就绪';
        outputCount.textContent = '条数: 0';
    }

    // 复制左侧结果
    function copyResult() {
        const text = outputEl.textContent;
        if (!text || text.includes('等待生成') || text.includes('未检测到')) {
            showToast('⚠️ 没有可复制的内容，请先生成');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板！')).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    // 复制右侧 SQL 模板
    function copyTemplateResult() {
        const text = outputPlainEl.textContent;
        if (!text || text.includes('请选择模式') || text.includes('请先输入数据')) {
            showToast('⚠️ 没有可复制的模板内容');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 模板已复制到剪贴板！')).catch(() => fallbackCopyTemplate(text));
        } else {
            fallbackCopyTemplate(text);
        }
    }

    function fallbackCopyTemplate(text) {
        const range = document.createRange();
        range.selectNodeContents(outputPlainEl);
        const sel = window.getSelection();
        if (!sel) {
            showToast('❌ 复制失败，请手动复制');
            return;
        }
        sel.removeAllRanges();
        sel.addRange(range);
        try {
            document.execCommand('copy');
            showToast('✅ 模板已复制到剪贴板！');
        } catch (_) {
            showToast('❌ 复制失败，请手动选中内容复制');
        }
        sel.removeAllRanges();
    }

    function fallbackCopy(text) {
        const range = document.createRange();
        range.selectNodeContents(outputEl);
        const sel = window.getSelection();
        if (!sel) {
            showToast('❌ 复制失败，请手动复制');
            return;
        }
        sel.removeAllRanges();
        sel.addRange(range);
        try {
            document.execCommand('copy');
            showToast('✅ 已复制到剪贴板！');
        } catch (_) {
            showToast('❌ 复制失败，请手动选中结果框内容复制');
        }
        sel.removeAllRanges();
    }

    let toastTimer = null;

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toastEl.classList.remove('show');
        }, 2200);
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    inputEl.addEventListener('input', convert);

    sqlModeSelect.addEventListener('change', convert);

    document.querySelectorAll('input[type="radio"], input[type="checkbox"], input[type="number"]').forEach(el => {
        el.addEventListener('change', function() {
            const outText = outputEl.textContent;
            if (outText && !outText.includes('等待生成') && !outText.includes('未检测到')) {
                convert();
            }
        });
    });

    inputEl.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            convert();
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        if (inputEl.value.trim()) {
            convert();
            debouncedTranslate();
        }
    });
</script>

</body>
</html>
